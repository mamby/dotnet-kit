name: Publish NuGet packages

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    environment: release

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "11.0.x"

      - name: Restore
        run: dotnet restore dotnet-kit.slnx

      - name: Build
        run: dotnet build dotnet-kit.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test dotnet-kit.slnx --configuration Release --no-build --no-restore

      - name: Pack
        run: dotnet pack dotnet-kit.slnx --configuration Release --no-build --no-restore --output ./artifacts

      - name: NuGet login
        uses: NuGet/login@v1
        with:
          user: mamby

      - name: Publish packages
        run: dotnet nuget push "./artifacts/*.nupkg" --source "https://api.nuget.org/v3/index.json" --skip-duplicate
